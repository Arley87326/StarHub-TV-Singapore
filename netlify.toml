# Static site: serves Starhub.m3u from the "public" directory.
# The Netlify UI is configured to publish "public", so that directory is kept
# in the repo (via public/.gitkeep) and the build copies the playlist into it.
# Starhub.m3u stays at the repo root so existing raw GitHub links keep working.
[build]
  publish = "public"
  command = "mkdir -p public && cp Starhub.m3u public/"

[functions]
  directory = "netlify/functions"
